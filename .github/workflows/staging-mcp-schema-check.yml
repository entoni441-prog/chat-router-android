name: Staging MCP schema verification
on:
  push:
    paths:
      - .github/workflows/staging-mcp-schema-check.yml
      - relay/mcp/authenticated-mcp-handler.js
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staging MCP tests and bundle
        id: verify
        shell: bash
        run: |
          set +e
          npm install --no-package-lock --ignore-scripts > /tmp/install.log 2>&1
          install_status=$?
          if [ "$install_status" -ne 0 ]; then echo 'install' > /tmp/staging-failed-stage; exit "$install_status"; fi
          npm test > /tmp/test.log 2>&1
          test_status=$?
          if [ "$test_status" -ne 0 ]; then echo 'test' > /tmp/staging-failed-stage; exit "$test_status"; fi
          npm run build > /tmp/build.log 2>&1
          build_status=$?
          if [ "$build_status" -ne 0 ]; then
            echo 'build' > /tmp/staging-failed-stage
            grep -Ei 'error|cannot resolve|could not resolve|not found|failed|missing|invalid' /tmp/build.log | sed -E 's@https?://[^ ]+@[URL]@g' | head -n 8 > /tmp/staging-build-errors
            exit "$build_status"
          fi
          echo 'none' > /tmp/staging-failed-stage
      - name: Publish sanitized verification result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ steps.verify.outcome }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          stage=Path('/tmp/staging-failed-stage').read_text().strip() if Path('/tmp/staging-failed-stage').exists() else 'workflow'
          body='Staging MCP schema verification: '+os.environ['JOB_RESULT']+'; stage='+stage+' (commit '+os.environ['GITHUB_SHA'][:12]+'). No production deployment performed.'
          if stage=='build' and Path('/tmp/staging-build-errors').exists():
            body+='\\nBuild diagnostics (filtered):\\n'+Path('/tmp/staging-build-errors').read_text()[:1200]
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/issues/1/comments',data=json.dumps({'body':body}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'ChatRouterStagingProbe/1.0'},method='POST')
          with urllib.request.urlopen(req,timeout=20) as response:
            print('Verification report status:',response.status)
          PY
