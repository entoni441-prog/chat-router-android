name: Build Chat Router APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0'"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon assembleDebug
      - name: Inspect APK identity and signing
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          {
            echo "GitHub run: $GITHUB_RUN_NUMBER"
            echo "Commit: $GITHUB_SHA"
            echo "APK SHA-256:"
            sha256sum "$APK"
            echo "Package identity and version:"
            "$AAPT" dump badging "$APK" | grep '^package:'
            echo "Signing certificate:"
            "$SIGNER" verify --print-certs "$APK"
            echo "WARNING: This is a debug APK; signing identity is not guaranteed stable across GitHub runners."
            echo "INSTALLATION: DO NOT install over an existing APK until certificate SHA-256 fingerprints are compared."
          } | tee apk-install-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: chat-router-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            apk-install-report.txt
