name: Staging MCP public protocol probe
on:
  push:
    paths:
      - .github/workflows/staging-mcp-public-probe.yml
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public OAuth metadata and unauthenticated MCP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 - <<'PY' > /tmp/staging_probe_result.txt 2>&1
          import json, urllib.request, urllib.error
          origin='https://chat-router-relay-staging.entoni441.workers.dev'
          checks=[
            ('oauth-resource','GET','/.well-known/oauth-protected-resource/mcp',None),
            ('oauth-authorization','GET','/.well-known/oauth-authorization-server',None),
            ('mcp-no-token','POST','/mcp',json.dumps({'jsonrpc':'2.0','id':1,'method':'initialize','params':{'protocolVersion':'2025-06-18','capabilities':{},'clientInfo':{'name':'staging-public-probe','version':'1'}}}).encode()),
          ]
          failures=[]
          for name,method,path,body in checks:
            headers={'Accept':'application/json','User-Agent':'ChatRouterStagingProbe/1.0 (+https://github.com/entoni441-prog/chat-router-android)'}
            if body: headers['Content-Type']='application/json'
            request=urllib.request.Request(origin+path,data=body,headers=headers,method=method)
            try:
              with urllib.request.urlopen(request,timeout=15) as response:
                status=response.status
                content_type=response.headers.get('Content-Type','').split(';')[0]
                payload=response.read(8192)
                response_headers=response.headers
            except urllib.error.HTTPError as error:
              status=error.code
              content_type=error.headers.get('Content-Type','').split(';')[0]
              payload=error.read(8192)
              response_headers=error.headers
            except Exception as error:
              print(f'{name}: transport_error={type(error).__name__}')
              raise
            safe={'check':name,'status':status,'content_type':content_type,
                  'server':response_headers.get('Server',''),
                  'cf_ray_present':bool(response_headers.get('CF-Ray')),
                  'cf_mitigated':response_headers.get('cf-mitigated',''),
                  'www_authenticate_present':bool(response_headers.get('WWW-Authenticate')),
                  'body_is_html':payload.lstrip().lower().startswith((b'<!doctype html',b'<html'))}
            if content_type=='application/json':
              try:
                obj=json.loads(payload)
                safe['json_keys']=sorted(obj.keys()) if isinstance(obj,dict) else []
                if isinstance(obj,dict):
                  safe['error_code']=obj.get('error_code') if isinstance(obj.get('error_code'),(str,int)) else None
                  safe['error_category']=obj.get('error_category') if isinstance(obj.get('error_category'),str) else None
                  safe['error_name']=obj.get('error_name') if isinstance(obj.get('error_name'),str) else None
                  safe['owner_action_required']=obj.get('owner_action_required') if isinstance(obj.get('owner_action_required'),bool) else None
                  safe['retryable']=obj.get('retryable') if isinstance(obj.get('retryable'),bool) else None
              except (ValueError,TypeError):
                safe['json_valid']=False
            if name!='mcp-no-token' and status==200 and content_type=='application/json':
              try:
                obj=json.loads(payload)
                safe['keys']=sorted(obj.keys())
                safe['has_authorization_servers']=bool(obj.get('authorization_servers'))
                safe['has_token_endpoint']=bool(obj.get('token_endpoint'))
                safe['has_registration_endpoint']=bool(obj.get('registration_endpoint'))
              except (ValueError,TypeError):
                safe['json_valid']=False
            print(json.dumps(safe,sort_keys=True))
            if name=='mcp-no-token' and status!=401:
              failures.append('Unexpected unauthenticated MCP status')
            if name!='mcp-no-token' and status!=200:
              failures.append(name+' OAuth metadata unavailable')
          if failures:
            raise SystemExit('; '.join(failures))
          PY
          probe_exit=$?
          PROBE_EXIT="$probe_exit" python3 - <<'PY'
          import json,os,urllib.request
          with open('/tmp/staging_probe_result.txt',encoding='utf-8',errors='replace') as f:
            lines=f.readlines()
          safe=[]
          for line in lines:
            try:
              obj=json.loads(line)
              if isinstance(obj,dict) and obj.get('check') in ('oauth-resource','oauth-authorization','mcp-no-token'):
                safe.append({key:obj.get(key) for key in ('check','status','content_type','server','cf_ray_present','cf_mitigated','www_authenticate_present','body_is_html','json_keys','error_code','error_category','error_name','owner_action_required','retryable') if key in obj})
            except (ValueError,TypeError):
              pass
          body='Automated staging probe. Exit: '+os.environ['PROBE_EXIT']+'\\n\\n'+'\\n'.join('\\x60'+json.dumps(x,sort_keys=True)+'\\x60' for x in safe)
          if not safe: body+='\\nNo structured endpoint results were emitted.'
          request=urllib.request.Request(
            'https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/issues/1/comments',
            data=json.dumps({'body':body}).encode(),
            headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
            method='POST')
          with urllib.request.urlopen(request,timeout=15) as response:
            print('Diagnostic issue comment HTTP:',response.status)
          PY
          exit "$probe_exit"
