name: Staging OAuth scope fix verification and deployment
on:
  push:
    branches: [fix/staging-mcp-verified-scopes]
    paths: [.github/workflows/staging-oauth-scope-fix.yml]
permissions:
  contents: read
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ed4b23d57f683e31166503d83e3b883b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and build staging only
        working-directory: relay
        run: |
          set -euo pipefail
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          npm test
          npx wrangler deploy ./src/oauth-entry.js --dry-run --outdir dist --name chat-router-relay-staging --compatibility-date 2026-10-20 --compatibility-flags nodejs_compat
      - name: Publish staging only with retained bindings
        working-directory: relay
        run: |
          set -euo pipefail
          cat > staging-deploy.json <<'JSON'
          {
            "name": "chat-router-relay-staging",
            "main": "./src/oauth-entry.js",
            "compatibility_date": "2026-10-20",
            "compatibility_flags": ["nodejs_compat"],
            "keep_vars": true,
            "kv_namespaces": [{"binding":"OAUTH_KV","id":"39b20e97fbfe43d7aa090674f1a3743f"}],
            "d1_databases": [{"binding":"ROUTER_DB","database_name":"chat-router-relay-staging","database_id":"e135858f-3e88-414a-8459-df69cb9d0455"}]
          }
          JSON
          npx wrangler deploy --config staging-deploy.json --keep-vars
