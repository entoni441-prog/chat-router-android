name: Chat Router OAuth MCP staging checks
on:
  push:
    paths:
      - 'relay/**'
      - '.github/workflows/chat-router-oauth-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax before install
        run: |
          find src mcp -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n 1 node --check
      - name: Install staging dependencies
        run: npm install --no-audit --no-fund
      - name: Run OAuth/MCP unit checks
        run: npm test
      - name: Dry-run bundle (NO DEPLOY)
        run: npx wrangler deploy --dry-run --outdir dist --main src/oauth-entry.js --name chat-router-relay --compatibility-date 2026-10-01
      - name: Save staging bundle
        uses: actions/upload-artifact@v4
        with:
          name: chat-router-oauth-staging
          path: relay/dist/
          retention-days: 7
