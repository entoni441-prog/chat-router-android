name: Build persistent signed Chat Router APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0'"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify persistent signing secrets
        env:
          KEYSTORE: ${{ secrets.CHAT_ROUTER_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CHAT_ROUTER_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CHAT_ROUTER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CHAT_ROUTER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing $v GitHub Actions secret. No installable release APK will be produced."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/chat-router-signing.jks"
          chmod 600 "$RUNNER_TEMP/chat-router-signing.jks"
          keytool -list -keystore "$RUNNER_TEMP/chat-router-signing.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Persistent signing keystore and alias validated."
      - name: Assign release version code
        run: echo "CHAT_ROUTER_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Build signed release
        env:
          CHAT_ROUTER_KEYSTORE_PATH: ${{ runner.temp }}/chat-router-signing.jks
          CHAT_ROUTER_STORE_PASSWORD: ${{ secrets.CHAT_ROUTER_STORE_PASSWORD }}
          CHAT_ROUTER_KEY_ALIAS: ${{ secrets.CHAT_ROUTER_KEY_ALIAS }}
          CHAT_ROUTER_KEY_PASSWORD: ${{ secrets.CHAT_ROUTER_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Verify APK signature and metadata
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$SIGNER" verify --verbose --print-certs "$APK" | tee apk-install-report.txt
          "$AAPT" dump badging "$APK" | grep '^package:' | tee -a apk-install-report.txt
          sha256sum "$APK" | tee -a apk-install-report.txt
          echo "INSTALLATION: compare signing certificate fingerprint with previous installed build before updating." | tee -a apk-install-report.txt
          echo "CAUTION: github.run_number belongs to this workflow only. Do not install if versionCode is lower than installed version." | tee -a apk-install-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: chat-router-signed-release
          path: |
            app/build/outputs/apk/release/*.apk
            apk-install-report.txt
          retention-days: 30
